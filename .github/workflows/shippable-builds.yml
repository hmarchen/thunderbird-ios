name: Shippable Builds

env:
  # DEFAULT_VERSION is used when no version is provided via workflow_dispatch.
  # Scheduled builds stamp the app with this version.
  DEFAULT_VERSION: &default_version "1.0"
  DEFAULT_NOTIFY_TESTERS: &default_notify_testers false
  DEFAULT_TEST_DEVICE: &default_test_device "iPhone 17"
  XCODE_VERSION: "26.1"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy_ios:
    runs-on: macos-26
    environment: thunderbird_release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode Select Version
        uses: mobiledevops/xcode-select-version-action@7b50160de7c8bd6a8c4ee2c2e6b5ee0983886c0b # v1.1.0
        with:
          xcode-select-version: ${{ env.XCODE_VERSION }}

      - name: Ensure iOS Simulator Runtime installed
        run: |
            # Wake up the CoreSimulator background service
            xcrun simctl list > /dev/null
            
            # Now download the platform
            xcodebuild -downloadPlatform iOS

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane


      - name: Resolve Package Dependencies
        working-directory: fastlane
        run: |
          xcodebuild -resolvePackageDependencies -workspace ../Thunderbird.xcworkspace -scheme Thunderbird

      - name: Upload build artifacts (if build fails)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-logs-${{ github.run_id }}
          path: |
            fastlane/logs/
            ~/Library/Logs/gym/
          retention-days: 7

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f fastlane/AuthKey_*.p8 \
                "$RUNNER_TEMP"/AuthKey_*.p8 \
                profile.mobileprovision \
                ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision \
                macos_certificate.p12 \
                certificate.p12 \
                temp_cert.pem \
                temp_key.pem
          if security list-keychains | grep -q "build.keychain"; then
            security delete-keychain build.keychain
          fi

